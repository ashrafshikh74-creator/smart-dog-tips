<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-labelledby="title desc">
<title id="title">Birdy the guide bird</title>
<desc id="desc">PawTint World original mascot illustration in a warm dimensional cartoon style.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#dff7f7"/><stop offset="1" stop-color="#c8e8dc"/></linearGradient>
 <linearGradient id="fur" x2=".2" y2="1"><stop stop-color="#43c9db"/><stop offset="1" stop-color="#087caa"/></linearGradient>
 <linearGradient id="cloth" x2="1" y2="1"><stop stop-color="#78bd4e"/><stop offset="1" stop-color="#276d47"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#49345a" flood-opacity=".2"/></filter>
</defs>
<ellipse cx="210" cy="382" rx="118" ry="18" fill="#57456a" opacity=".14"/>
<style>
@keyframes birdy-wing-left{0%,78%,100%{transform:rotate(0deg)}84%{transform:rotate(-5deg)}90%{transform:rotate(1deg)}}
@keyframes birdy-wing-right{0%,78%,100%{transform:rotate(0deg)}84%{transform:rotate(5deg)}90%{transform:rotate(-1deg)}}
.wing-left{transform-box:fill-box;transform-origin:100% 85%;animation:birdy-wing-left 6.8s ease-in-out infinite}
.wing-right{transform-box:fill-box;transform-origin:0% 85%;animation:birdy-wing-right 6.8s ease-in-out infinite}
@keyframes birdy-idle{0%,100%{transform:translateY(0) rotate(-.3deg)}50%{transform:translateY(-3px) rotate(.3deg)}}
.mascot-body{transform-box:fill-box;transform-origin:50% 90%;animation:birdy-idle 3.8s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.wing-left,.wing-right,.mascot-body{animation:none}}
@keyframes birdy-blink{0%,91%,94%,100%{transform:scaleY(1)}92.5%{transform:scaleY(.08)}}
.birdy-eyes{transform-box:fill-box;transform-origin:50% 50%;animation:birdy-blink 5.4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.birdy-eyes{animation:none}}
</style>
<g class="mascot-body" filter="url(#shadow)">
<ellipse cx="210" cy="245" rx="104" ry="126" fill="url(#fur)"/><ellipse cx="210" cy="288" rx="68" ry="72" fill="#ffe98b"/>
<path class="wing-left" d="M125 220Q35 133 52 82Q113 103 164 193Z" fill="#1da6d0" stroke="#087caa" stroke-width="8"/><path class="wing-right" d="M295 220Q385 133 368 82Q307 103 256 193Z" fill="#1da6d0" stroke="#087caa" stroke-width="8"/>
<path d="M120 124Q150 70 210 78Q270 70 300 124" fill="none" stroke="#0c8cb7" stroke-width="22" stroke-linecap="round"/>
<g class="birdy-eyes"><ellipse cx="170" cy="205" rx="25" ry="33" fill="#fff"/><ellipse cx="250" cy="205" rx="25" ry="33" fill="#fff"/><ellipse cx="174" cy="210" rx="14" ry="22" fill="#174b78"/><ellipse cx="246" cy="210" rx="14" ry="22" fill="#174b78"/><circle cx="179" cy="199" r="7" fill="#fff"/><circle cx="251" cy="199" r="7" fill="#fff"/></g>
<path d="M190 249L230 249L210 280Z" fill="#f28c35"/><path d="M174 305Q210 322 246 305" fill="none" stroke="#d99137" stroke-width="7" stroke-linecap="round"/>
<path d="M122 113Q210 72 298 113L283 133Q210 103 137 133Z" fill="#1c7db5" stroke="#145078" stroke-width="8"/><ellipse cx="170" cy="113" rx="31" ry="19" fill="#d8efff" stroke="#b47a2c" stroke-width="9"/><ellipse cx="250" cy="113" rx="31" ry="19" fill="#d8efff" stroke="#b47a2c" stroke-width="9"/>
<path d="M142 293Q210 319 278 293L270 334Q210 356 150 334Z" fill="#4f9b48"/><path d="M280 304L333 327L322 357L267 334Z" fill="#347346" stroke="#76502b" stroke-width="7"/>
<path d="M162 357L145 382M258 357L275 382" stroke="#e68a2e" stroke-width="14" stroke-linecap="round"/>
</g><style>
/* MOTION PASS 06 — guide wing rhythm */
@keyframes birdy-wing-left{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-7deg)}}
@keyframes birdy-wing-right{0%,100%{transform:rotate(0deg)}50%{transform:rotate(7deg)}}
.wing-left,.wing-right{transform-box:fill-box;transform-origin:70% 85%;animation:birdy-wing-left 2.2s ease-in-out infinite}
.wing-right{animation-name:birdy-wing-right;transform-origin:30% 85%}
@media(prefers-reduced-motion:reduce){.wing-left,.wing-right{animation:none}}
</style></svg>