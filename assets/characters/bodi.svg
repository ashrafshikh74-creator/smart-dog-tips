<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-labelledby="title desc">
<title id="title">Bodi the explorer puppy</title>
<desc id="desc">PawTint World original mascot illustration in a warm dimensional cartoon style.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fff0c9"/><stop offset="1" stop-color="#f4c66c"/></linearGradient>
 <linearGradient id="fur" x2=".2" y2="1"><stop stop-color="#ffc66c"/><stop offset="1" stop-color="#c97832"/></linearGradient>
 <linearGradient id="cloth" x2="1" y2="1"><stop stop-color="#42a8ef"/><stop offset="1" stop-color="#174e9a"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#49345a" flood-opacity=".2"/></filter>
</defs>
<ellipse cx="210" cy="382" rx="118" ry="18" fill="#57456a" opacity=".14"/>
<style>
@keyframes bodi-idle{0%,100%{transform:translateY(0) rotate(-.25deg)}48%{transform:translateY(-3px) rotate(.25deg)}}
@keyframes bodi-ear{0%,82%,100%{transform:rotate(0)}88%{transform:rotate(-3deg)}94%{transform:rotate(1deg)}}
.mascot-body{transform-box:fill-box;transform-origin:50% 90%;animation:bodi-idle 4.2s ease-in-out infinite}
.bodi-ears{transform-box:fill-box;transform-origin:50% 25%;animation:bodi-ear 5.6s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.mascot-body,.bodi-ears{animation:none}}
@keyframes bodi-blink{0%,91%,94%,100%{transform:scaleY(1)}92.5%{transform:scaleY(.08)}}
.bodi-eyes{transform-box:fill-box;transform-origin:50% 50%;animation:bodi-blink 5.8s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.bodi-eyes{animation:none}}
</style>
<g class="mascot-body" filter="url(#shadow)">

<path class="bodi-ears" d="M105 152Q42 106 64 214Q75 267 135 247Z" fill="#b96e34"/><path class="bodi-ears" d="M315 151Q378 105 356 214Q345 267 285 247Z" fill="#b96e34"/>
<ellipse cx="210" cy="245" rx="116" ry="119" fill="url(#fur)"/><ellipse cx="210" cy="288" rx="78" ry="66" fill="#fff0d8"/>
<ellipse cx="135" cy="345" rx="42" ry="28" fill="#f7d49b"/><ellipse cx="285" cy="345" rx="42" ry="28" fill="#f7d49b"/>
<path d="M112 129Q130 42 210 55Q290 42 308 129L286 143Q210 116 134 143Z" fill="#2587cf" stroke="#174e9a" stroke-width="8"/>
<path d="M130 107Q210 72 290 107" fill="none" stroke="#f5d28b" stroke-width="9"/>
<ellipse cx="210" cy="190" rx="113" ry="100" fill="url(#fur)"/><ellipse cx="210" cy="228" rx="75" ry="55" fill="#fff0d8"/>
<path d="M155 110Q165 88 190 95M230 95Q260 88 272 110" fill="none" stroke="#8b4a25" stroke-width="9" stroke-linecap="round"/>
<g class="bodi-eyes"><ellipse cx="169" cy="184" rx="20" ry="27" fill="#fff"/><ellipse cx="251" cy="184" rx="20" ry="27" fill="#fff"/><ellipse cx="172" cy="188" rx="10" ry="17" fill="#513322"/><ellipse cx="248" cy="188" rx="10" ry="17" fill="#513322"/><circle cx="176" cy="180" r="5" fill="#fff"/><circle cx="252" cy="180" r="5" fill="#fff"/></g>
<ellipse cx="210" cy="225" rx="18" ry="13" fill="#583329"/><path d="M188 244Q210 267 233 244" fill="none" stroke="#713d32" stroke-width="7" stroke-linecap="round"/>
<path d="M135 278Q210 314 285 278L272 326Q210 353 148 326Z" fill="#2587cf"/><circle cx="210" cy="318" r="17" fill="#f2c45e" stroke="#8a5a26" stroke-width="5"/>

</g><style>
/* MOTION PASS 06 — subtle explorer ear twitch */
@keyframes bodi-ear-twitch{0%,82%,100%{transform:rotate(0)}88%{transform:rotate(-4deg)}94%{transform:rotate(1.5deg)}}
.bodi-ears{transform-box:fill-box;transform-origin:50% 20%;animation:bodi-ear-twitch 6.4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.bodi-ears{animation:none}}
</style></svg>